services:
  postgres:
    image: postgres:16-alpine
    container_name: epadash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: epadash
      POSTGRES_PASSWORD: epadash_dev_password
      POSTGRES_DB: epadash_dev
    ports:
      - "5432:5432"
    volumes:
      - epadash_pgdata:/var/lib/postgresql/data
volumes:
  epadash_pgdata:
